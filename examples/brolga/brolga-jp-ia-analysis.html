/* COMPONENT LAYER — shared by every deliverable. Do not edit per client: change theme.css.
   Built from the baseline review package's component system. Uses only theme variables. */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--font-body);
  font-size:16px;line-height:1.8;letter-spacing:var(--tracking)}
:lang(ja),.ja{letter-spacing:var(--tracking-ja);word-break:auto-phrase}
html[lang=ja] body{letter-spacing:var(--tracking-ja)}
html[lang=ja] p,html[lang=ja] li,html[lang=ja] td,html[lang=ja] h1,html[lang=ja] h2,html[lang=ja] h3{word-break:auto-phrase;line-break:strict}
h1,h2,h3,h4{font-family:var(--font-head);word-break:auto-phrase;letter-spacing:.01em}
a{color:var(--deep);text-underline-offset:3px}
img{max-width:100%}
p{max-width:780px}
code{font-family:ui-monospace,Menlo,monospace;font-size:.86em;background:var(--tint);padding:1px 6px;border-radius:4px;letter-spacing:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
@media(max-width:700px){.wrap{padding:0 20px}}
#app{display:block}

/* ---------- Package navigation ---------- */
.backbar{background:var(--deep);color:#fff;font-size:13px}
.backbar .wrap{display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:16px;padding-right:150px}
.backbar a{color:#fff;text-decoration:none;opacity:.92}
.backbar a:hover{opacity:1;text-decoration:underline}
.backbar span{opacity:.75;letter-spacing:.06em;font-size:12px}
@media(max-width:700px){.backbar span{display:none}}

/* ---------- Cover ---------- */
.cover{background:var(--brand);color:#fff;padding:var(--s8) 0 var(--s7)}
.cover .kicker{font-size:13px;letter-spacing:.12em;opacity:.85}
.cover h1{font-size:40px;line-height:1.35;font-weight:600;margin:var(--s4) 0;max-width:860px}
.cover p{max-width:780px;margin:0;opacity:.92}
.cover dl{display:grid;grid-template-columns:repeat(4,auto);gap:var(--s2) var(--s6);margin:var(--s6) 0 0;font-size:14px;justify-content:start}
.cover dt{opacity:.7;font-size:12px;letter-spacing:.06em}
.cover dd{margin:0}
.cover .counts{display:flex;gap:var(--s6);margin-top:var(--s5)}
.cover .counts b{display:block;font-size:30px;line-height:1.2;font-weight:600}
.cover .counts span{font-size:12px;opacity:.8;letter-spacing:.06em}
.status{display:inline-block;margin-top:var(--s5);font-size:12px;letter-spacing:.08em;border:1px solid rgba(255,255,255,.55);border-radius:var(--pill);padding:3px 12px}
@media(max-width:860px){.cover h1{font-size:30px}.cover dl{grid-template-columns:1fr 1fr}}

/* ---------- Section nav and sections ---------- */
nav.toc{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--canvas) 96%,transparent);border-bottom:1px solid var(--border)}
nav.toc .wrap{display:flex;gap:var(--s2) var(--s5);flex-wrap:wrap;padding-top:10px;padding-bottom:10px;font-size:14px}
nav.toc a{color:var(--text-2);text-decoration:none}
nav.toc a:hover{color:var(--text)}
@media(max-width:700px){nav.toc{background:var(--canvas)}nav.toc .wrap{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none}nav.toc .wrap::-webkit-scrollbar{display:none}}
section{padding:var(--s8) 0 0;scroll-margin-top:56px}
.sec-head{margin-bottom:var(--s5)}
.sec-head .no{font-size:13px;color:var(--text-2);letter-spacing:.1em;margin-bottom:4px}
h2{font-size:30px;line-height:1.4;margin:0;font-weight:600}
.lead{font-size:18px;color:var(--text-2);max-width:860px;margin:var(--s3) 0 0}
h3{font-size:20px;line-height:1.5;margin:var(--s6) 0 var(--s3);font-weight:600}
h4{font-size:13px;letter-spacing:.08em;color:var(--text-2);font-weight:600;margin:var(--s5) 0 var(--s2)}
.small{font-size:13px;color:var(--text-2)}
.howto{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s4) var(--s5);margin:var(--s5) 0 0;font-size:14px;max-width:none}

/* ---------- Tags and priority ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1;padding:6px 12px;border-radius:var(--pill);background:var(--tint);color:var(--deep);border:1px solid var(--border);white-space:nowrap}
.tag small{font-weight:400;color:var(--text-2);font-size:12px}
.prio{background:transparent;border:1.5px dotted currentColor}
.prio.high{color:var(--issue)} .prio.mid{color:var(--warn)} .prio.low{color:var(--text-2)}
.dot{display:inline-block;white-space:nowrap;flex:none;font-size:12px;font-weight:600;border:1.5px dotted;border-radius:var(--pill);padding:1px 8px;margin-left:6px;line-height:1.5}
.dot.high{color:var(--issue)} .dot.mid{color:var(--warn)} .dot.low{color:var(--text-2)}
.pill{display:inline-block;min-width:24px;padding:0 7px;border-radius:6px;color:#fff;font:700 12px/22px var(--font-body);text-align:center;letter-spacing:0}
.pill.r{background:var(--issue)} .pill.g{background:var(--good)} .pill.d{background:var(--deep)}
.ph,.tbd{color:var(--issue);font-weight:600}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);font-size:14px;line-height:1.7}
.tbl th,.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tbl th{background:var(--sand);font-weight:600;font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl td.bad{color:var(--issue)} .tbl td.ok{color:var(--good)}
.tbl .grp td{background:var(--tint);font-weight:600}
.tbl.kv th:first-child,.tbl.kv td:first-child{white-space:nowrap;font-weight:600}
.scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-sm);margin:var(--s4) 0}
.persp td:first-child{font-weight:600}
.persp td:first-child small{display:block;font-weight:400;color:var(--text-2)}
.flist{list-style:none;margin:0;padding:0}
.flist li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin:4px 0}
.flist .n{font-weight:700;min-width:22px;color:var(--issue)}
.flist a{flex:1;color:var(--text);text-decoration:none}
.flist a:hover{text-decoration:underline}
.verdict{font-weight:600;white-space:nowrap}
.verdict.holds{color:var(--good)} .verdict.mostly{color:var(--warn)} .verdict.adjusted{color:var(--issue)}
@media(max-width:700px){.tbl{font-size:13px}.tbl th,.tbl td{padding:10px}}

/* ---------- Screens reviewed and counts (top of the report) ---------- */
.screens{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin:var(--s5) 0 0}
.screens figure img{width:100%;aspect-ratio:390/600;object-fit:cover;object-position:top;border-radius:var(--r-md)}
.screens figcaption{font-size:13px;color:var(--text);margin-top:6px}
.screens figcaption small{display:block;color:var(--text-2);font-size:12px}
.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:640px;margin:var(--s5) 0 0;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.tally div{padding:16px 20px;border-right:1px solid var(--border)}
.tally div:last-child{border-right:0}
.tally b{display:block;font-size:34px;line-height:1.1;font-weight:600}
.tally span{font-size:13px;color:var(--text-2)}
.tally .high b{color:var(--issue)} .tally .mid b{color:var(--warn)}
@media(max-width:560px){.tally{grid-template-columns:1fr 1fr}.tally div:nth-child(2){border-right:0}.tally div:nth-child(-n+2){border-bottom:1px solid var(--border)}}

/* ---------- Facts (market data) ---------- */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;margin:var(--s5) 0}
.facts div{background:var(--surface);padding:var(--s5)}
.facts b{display:block;font-size:30px;line-height:1.2;font-weight:600;color:var(--deep)}
.facts span{display:block;font-size:14px;margin-top:6px}
.facts em{display:block;font-style:normal;font-size:12px;color:var(--text-2);margin-top:6px}
.facts .so{display:block;font-size:13px;margin-top:8px;color:var(--text)}
@media(max-width:860px){.facts{grid-template-columns:1fr}}

/* ---------- Findings ---------- */
.finding{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin:var(--s6) 0;overflow:hidden;scroll-margin-top:56px}
.f-head{display:grid;grid-template-columns:64px 1fr;gap:var(--s4);padding:var(--s5) var(--s5) var(--s4)}
.f-no{width:48px;height:48px;border-radius:var(--r-sm);background:var(--issue);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:0}
.f-head h3{margin:0 0 var(--s3);font-size:22px;line-height:1.5}
.f-tags{display:flex;flex-wrap:wrap;gap:8px}
.f-body{padding:0 var(--s5) var(--s5)}
.f-body>p{margin:0 0 var(--s4)}
@media(max-width:860px){.f-head{grid-template-columns:1fr}}
.where{font-size:13px;color:var(--text-2);margin:-4px 0 var(--s4)}
.why b:first-child{color:var(--text)}
.shots{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start;margin:var(--s4) 0}
.shots.one{grid-template-columns:1fr}
.shots.wide{grid-template-columns:1.6fr 1fr}
@media(max-width:860px){.shots.wide{grid-template-columns:1fr}}
figure{margin:0}
figure img{display:block;width:auto;max-width:100%;height:auto;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;cursor:zoom-in}
/* Evidence is a crop of the element (annotate.mjs), shown at its own CSS size (assemble.mjs
   sets the width), two or three to a row, as in the reference review. */
.shots figure img{height:auto}
@media(max-width:700px){.shots,.shots.wide{grid-template-columns:1fr}.shots figure img{width:100%!important}}
figcaption{font-size:13px;color:var(--text-2);margin-top:8px;line-height:1.6}
.ph-img{display:grid;place-items:center;min-height:180px;border:1px dashed var(--border-strong);border-radius:var(--r-sm);background:var(--tint);color:var(--text-2);font-size:12px;text-align:center;padding:12px}
.ref{background:var(--good-bg);border-radius:var(--r-sm);padding:var(--s5);margin:var(--s5) 0 0}
.ref h4{margin-top:0;color:var(--good)}
.ref .shots{grid-template-columns:repeat(auto-fit,minmax(200px,260px))}
.ref p,.ref li{font-size:14px}
.ref ul{margin:var(--s2) 0 0;padding-left:20px}
.ref .not{color:var(--text-2)}
.prop{border-top:1px solid var(--border);margin-top:var(--s5);padding-top:var(--s4)}
.prop h4{margin-top:0;color:var(--deep)}
.prop ul{margin:0;padding-left:20px}
.prop li{margin:6px 0}
.prop .because,.prop .measure{font-size:14px;margin:var(--s3) 0 0}
.ask{font-size:14px;color:var(--text-2);margin:var(--s4) 0 0;padding-left:var(--s4);border-left:2px solid var(--border-strong)}
.ask b{color:var(--text)}
ul.covers{margin:0 0 var(--s4);padding-left:20px;font-size:15px}
ul.covers li{margin:4px 0}
.tbl.more td:first-child{font-weight:700;color:var(--issue)}
.tbl.more img.thumb{display:block;max-width:240px;margin-top:8px;border:1px solid var(--border);border-radius:var(--r-sm)}
.mk{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--issue);color:#fff;font-size:12px;font-weight:700;vertical-align:1px;letter-spacing:0;font-family:var(--font-body)}
.mk.g{background:var(--good)} .mk.d{background:var(--deep)}

/* ---------- Page length diagram (report) ---------- */
.len{margin:var(--s4) 0}
.len .row{display:grid;grid-template-columns:120px 1fr;gap:var(--s3);align-items:center;margin:10px 0;font-size:13px}
.len .bar{position:relative;height:30px;background:var(--tint);border-radius:6px}
.len .seg{position:absolute;top:0;bottom:0;border-radius:6px;font-size:12px;color:#fff;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden}
.len .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text)}
.len .lab{position:absolute;top:34px;font-size:12px;color:var(--text-2);white-space:nowrap;transform:translateX(-50%)}
.len .scale{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-left:132px}

/* ---------- By-page layout: a sticky column of annotated screens beside the findings ---------- */
.area{display:grid;grid-template-columns:300px minmax(0,1fr);gap:40px;margin-top:var(--s5)}
.area .figs{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:20px;max-height:calc(100vh - 80px);overflow:auto;padding-right:6px}
.area .figs img{width:100%;max-height:none;border-radius:var(--r-md)}
.area .finding:first-child{margin-top:0}
@media(max-width:1000px){.area{grid-template-columns:240px minmax(0,1fr);gap:24px}}
@media(max-width:760px){.area{grid-template-columns:1fr}.area .figs{position:static;max-height:none;flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory}.area .figs figure{flex:0 0 72%;scroll-snap-align:start}}

.page-sec{margin-top:var(--s7);scroll-margin-top:56px}
.page-sec h3.page-h{font-size:24px;margin:0 0 4px}

/* ---------- Panels, lists, order ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s5)}
.panel h4{margin-top:0}
.panel ul,.panel ol{margin:0;padding-left:20px;font-size:14px}
.panel li{margin:6px 0}
.panel.lead-panel{background:var(--deep);color:#fff;border-color:var(--deep)}
.panel.lead-panel h4{color:rgba(255,255,255,.78)}
.panel.good{border-color:var(--good)} .panel.good h4{color:var(--good)}
ol.order{list-style:none;counter-reset:o;padding:0;margin:var(--s3) 0;max-width:820px}
ol.order li{counter-increment:o;display:grid;grid-template-columns:28px 200px 1fr;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
ol.order li:before{content:counter(o);font-weight:700;color:var(--primary)}
@media(max-width:700px){ol.order li{grid-template-columns:28px 1fr}ol.order li span{grid-column:2}}
.sources{font-size:14px;padding-left:24px}
.sources li{margin:6px 0}
footer.doc{margin-top:var(--s8);border-top:1px solid var(--border);padding:var(--s5) 0 var(--s8);font-size:13px;color:var(--text-2)}

/* ---------- IA: trees ---------- */
.trees{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);margin:var(--s4) 0}
@media(max-width:960px){.trees{grid-template-columns:1fr}}
.tree{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--s4) var(--s5);font-size:13px;line-height:1.7}
.tree h4{margin:0 0 var(--s2)}
.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{padding-left:16px;border-left:1px solid var(--border);margin:2px 0 6px 4px}
.tree li{margin:1px 0}
.tree .g{font-weight:600}
.tree .d{color:var(--text-2);font-size:12px}
.tree .bad{color:var(--issue)} .tree .ok{color:var(--good)}
.tree .new{color:var(--good);font-weight:600}

/* ---------- IA: page layout (roles, bars, section lists) ---------- */
.legend-row{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--text-2);margin:var(--s3) 0}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:14px;height:14px;border-radius:3px;display:inline-block}
.r-decide{background:var(--role-decide)} .r-reassure{background:var(--role-reassure);color:var(--text)!important} .r-persuade{background:var(--role-persuade);color:var(--text)!important}
.r-sell{background:var(--role-sell);color:var(--text)!important} .r-navigate{background:var(--role-navigate);color:var(--text)!important}
.pmap{margin:var(--s4) 0 var(--s5)}
.pmap .r{display:grid;grid-template-columns:160px 1fr;gap:var(--s3);align-items:center;margin:8px 0}
.pmap .r>b{font-size:13px;font-weight:600;line-height:1.3}
.pmap .r>b small{display:block;font-weight:400;color:var(--text-2);font-size:12px}
.pmap .r.prop>b{color:var(--good)}
.pmap .bar{position:relative;height:38px;background:var(--canvas);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.pmap .s{position:absolute;top:0;bottom:0;border-right:1px solid rgba(255,255,255,.7);font-size:12px;line-height:1.2;padding:3px 4px;overflow:hidden;color:#fff;letter-spacing:0}
.pmap .axis{display:grid;grid-template-columns:160px 1fr;gap:var(--s3);font-size:12px;color:var(--text-2)}
.pmap .axis div{display:flex;justify-content:space-between}
.shares{width:100%;border-collapse:collapse;font-size:13px;margin:var(--s3) 0}
.shares th,.shares td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:right}
.shares th:first-child,.shares td:first-child{text-align:left}
.shares td.bad{color:var(--issue);font-weight:600} .shares td.ok{color:var(--good);font-weight:600}
.lrow{display:grid;grid-template-columns:minmax(0,1.4fr) 110px minmax(0,2fr) 48px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.lrow.lhead{font-size:12px;color:var(--text-2);letter-spacing:.06em;font-weight:600}
.lrow .lrole{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.lrow .lrole i{width:10px;height:10px;border-radius:3px}
.lrow .track{position:relative;height:12px;background:var(--canvas);border-radius:3px}
.lrow .track b{position:absolute;top:0;bottom:0;border-radius:3px}
.lrow .lscr{text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums}
@media(max-width:700px){.lrow{grid-template-columns:1fr 90px 40px}.lrow .track{display:none}}
.layoutcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s5);margin:var(--s4) 0}
.layoutcard h3{margin-top:0}
.reads{font-size:14px;margin:var(--s3) 0 0;max-width:none}
.reads b{color:var(--deep)}

/* ---------- IA: heading hierarchy ---------- */
.hrow{display:grid;grid-template-columns:64px minmax(0,2fr) 76px minmax(0,1.4fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:baseline}
.hrow .lv{font-weight:700;color:var(--deep);font-variant-numeric:tabular-nums}
.hrow .hid{color:var(--issue);font-weight:600;font-size:12px}
.hrow .vis{color:var(--good);font-weight:600;font-size:12px}
@media(max-width:700px){.hrow{grid-template-columns:56px 1fr 64px}.hrow .small{grid-column:2/-1}}

/* ---------- IA: task paths ---------- */
.task{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s5);margin:var(--s4) 0}
.task h3{margin:0 0 var(--s2);font-size:18px}
.task .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--text-2);margin-top:var(--s3)}
.task .note{font-size:14px;margin:var(--s3) 0 0;max-width:none}
.task-ev{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-top:10px}
.task-ev figure{flex:0 1 320px}
.task-ev .note{margin:0;flex:1 1 280px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 2px}
.flow .st{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:5px 10px;font-size:12.5px;line-height:1.4}
.flow .st.x{border-color:var(--issue);color:var(--issue);background:var(--issue-bg)}
.flow .st.g{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.flow .ar{color:var(--text-2);font-size:13px}
.metric{display:inline-block;font-size:12px;font-weight:600;border-radius:var(--pill);padding:3px 10px;background:var(--tint);color:var(--deep);margin-left:6px}
.metric.bad{background:var(--issue-bg);color:var(--issue)} .metric.ok{background:var(--good-bg);color:var(--good)}
.sev{font-size:12px;font-weight:600;white-space:nowrap}
.sev.maj,.sev.high{color:var(--issue)} .sev.min,.sev.mid{color:var(--warn)} .sev.low{color:var(--text-2)}
.cand td:first-child{font-weight:700;color:var(--issue);white-space:nowrap}
.prop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);margin-top:var(--s4)}
.prop-grid>div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px}
.prop-grid h3{font-size:16px;margin:0 0 8px}
.prop-grid ol{margin:0;padding-left:20px;font-size:14px}
.prop-grid li .why{display:block;font-size:12px;color:var(--text-2)}
.prop-grid li.moved{color:var(--good);font-weight:600}
@media(max-width:860px){.prop-grid{grid-template-columns:1fr}}

/* ---------- Index ---------- */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:960px){.cards{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--primary);transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.card img,.card .ph-img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border:0;border-bottom:1px solid var(--border);border-radius:0;min-height:0}
.card .body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.card .step{font-size:12px;letter-spacing:.1em;color:var(--text-2);font-weight:600}
.card h3{margin:6px 0 8px;font-size:20px}
.card p{font-size:14px;margin:0 0 12px}
.card ul{margin:0 0 16px;padding-left:18px;font-size:14px;color:var(--text-2)}
.card .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-2);border-top:1px solid var(--border);padding-top:12px}
.card .open{font-weight:600;color:var(--deep)}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:860px){.keys{grid-template-columns:1fr}}
.key{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px;font-size:15px}
.key b{display:block;font-size:16px;margin-bottom:4px;font-weight:600}
.key .src{display:block;font-size:12px;color:var(--text-2);margin-top:8px}
.process{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
@media(max-width:1000px){.process{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.process{grid-template-columns:1fr}}
.process li{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 14px 16px;font-size:13px;line-height:1.6;counter-increment:s;display:flex;flex-direction:column}
.process li::before{content:counter(s,decimal-leading-zero);font-size:12px;color:var(--text-2);letter-spacing:.08em}
.process b{display:block;font-size:14px;margin:2px 0 6px;font-weight:600;line-height:1.45}
.process .who{margin-top:auto;padding-top:10px;font-size:12px;font-weight:600;letter-spacing:.04em}
.who.h{color:var(--deep)} .who.t{color:var(--text-2)}
.who.h::before{content:"● "} .who.t::before{content:"○ "}
.legend{font-size:13px;color:var(--text-2);margin:12px 0 0}
.commit{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
@media(max-width:960px){.commit{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.commit{grid-template-columns:1fr}}

<header class="cover"><div class="wrap">
<div class="kicker">INFORMATION ARCHITECTURE · BROLGA JP · DRAFT</div>
<h1>Width is a first-class route into the catalogue, but the structure drops it between pages</h1>
<p>Width help, membership and support also have no fixed place. How the navigation, page order and labels support, or get in the way of, the tasks a Japanese runner comes to do, walked on a phone. Read with the <a href="brolga-jp-localisation-review.html" style="color:#fff">localisation review</a>.</p>
<div class="counts"><div><b>8</b><span>TASK PATHS</span></div><div><b>3</b><span>FAIL</span></div><div><b>4</b><span>PARTLY</span></div><div><b>1</b><span>SUCCEEDS</span></div></div>
<div class="status">DRAFT · FOR DISCUSSION</div>
</div></header>

<nav class="toc" aria-label="Sections"><div class="wrap">
<a href="#summary">Summary</a><a href="#nav">Navigation</a><a href="#layout">Page layout</a><a href="#headings">Headings</a><a href="#paths">Task paths</a><a href="#labels">Labels</a><a href="#ia-findings">IA findings</a><a href="#proposal">Proposed structure</a><a href="#candidates">Additional findings</a><a href="#notes">Notes</a>
</div></nav>

<main class="wrap">

<section id="summary">
<div class="sec-head"><div class="no">01</div><h2>Summary</h2>
<p class="lead">The frame is sound: width is a menu axis (2 taps to the wide list), the buy box runs 足幅 → カラー → サイズ → button, and search understands 幅広 and 4E. The problems sit at the hand-offs between pages, and around the decision.</p></div>
<div class="scroll"><table class="tbl">
<tr><th style="width:30%">Issue</th><th>What we measured</th><th style="width:24%">Best local reference</th><th style="width:12%">Findings</th></tr>
<tr><td><b>The width doesn't travel.</b> The chosen width and every filter live in page state only.</td><td>Wide list → product page: 7 of 7 open on 標準. Filter + back: 7件 → 10件, 4 taps to rebuild. 0 filter or sort parameters in the URL.</td><td>HOKA: width as a URL variant, 「ワイド」 in the tile name</td><td><a href="brolga-jp-localisation-review.html#f5">#5</a> IA-1, IA-2</td></tr>
<tr><td><b>Width help has three homes and no decisive answer.</b></td><td>The same overlapping text in 3 places; 0 girth values; the help link 0.27 screens below the width toggle, labelled for サイズ. 4 names for the size guide.</td><td>ASICS: サイズガイド at the size row and web foot measuring under the button</td><td><a href="brolga-jp-localisation-review.html#f6">#6</a> IA-3</td></tr>
<tr><td><b>Fit facts sit after the choice.</b></td><td>Escarp WP half-size note at screen 3.8 (grid at 2.5); Updraft Carbon's wide alternative first appears at 3.7, sideways in a table.</td><td>On: fit verdict under the add button</td><td><a href="brolga-jp-localisation-review.html#f7">#7</a> IA-7, IA-15</td></tr>
<tr><td><b>Help has no home.</b> Contact, returns and the size guide are not in the menu; LINE and search dead-end.</td><td>Menu サポート: 2 links. Contact: 1 route, footer only, 6–7 screens down. 7 queries tried in search (返品, 送料, 後払い, PayPay, サイズ, 27, LINE): 0 answers.</td><td>HOKA: カスタマーサービス, login and order status in the menu</td><td><a href="brolga-jp-localisation-review.html#f14">#14</a> IA-6, IA-8, IA-9</td></tr>
<tr><td><b>Membership is a condition without a home.</b></td><td>0 login, registration or 会員ページ entries in header, menu or footer; the run-return condition in 3 places.</td><td>ASICS: OneASICS named under the button, sign-in in the header</td><td><a href="brolga-jp-localisation-review.html#f11">#11</a> IA-5</td></tr>
</table></div>
</section>

<section id="nav">
<div class="sec-head"><div class="no">02</div><h2>Navigation</h2>
<p class="lead">The phone menu as shipped, HOKA Japan's menu (read live on 17 November 2026), and the proposed structure. Desktop uses the same groups in a mega panel with three top-level items.</p></div>
<div class="trees">
<div class="tree"><h4>BROLGA JP (AS SHIPPED)</h4><ul>
<li class="g">用途で選ぶ</li><ul><li>ロード · トレイル · レース · キッズ</li><li>すべてのシューズ</li></ul>
<li class="g">足幅で選ぶ</li><ul><li class="ok">標準（2E相当） · ワイド（4E相当）</li></ul>
<li class="g">足幅のこと</li><ul><li class="bad">one link standing as a group; no link on to the wide models</li></ul>
<li class="g">サポート</li><ul><li>ご利用ガイド · よくある質問</li><li class="bad">✕ no お問い合わせ, 返品・交換, サイズガイド</li><li class="bad">✕ no ログイン or 会員登録 anywhere</li></ul>
<li class="d">Footer only: LINEで相談する (no LINE), メール, 返品・交換, サイズの選び方</li></ul></div>
<div class="tree"><h4>HOKA JAPAN</h4><ul>
<li class="g">メンズ / レディース</li><ul><li>新着 · 特集 · ベストセラー</li><li>シューズ: ロード · トレイル · …</li><li class="ok">ワイドサイズ (its own entry)</li><li>用途別: ランニング · レース · リカバリー</li><li>モデル名: クリフトン · ボンダイ · …</li></ul>
<li class="g">Account</li><ul><li class="ok">マイアカウント · ログイン · アカウントの作成</li><li class="ok">ご注文の確認 · 配送状況の確認</li></ul>
<li class="g">Help</li><ul><li class="ok">カスタマーサービス (help centre)</li></ul>
<li class="d">Organised by gender, then type, use and model; account and help in the same menu</li></ul></div>
<div class="tree"><h4>PROPOSED FOR BROLGA</h4><ul>
<li class="g">用途で選ぶ</li><ul><li>ロード · トレイル · レース · キッズ</li><li>すべてのシューズ</li></ul>
<li class="g">足幅で選ぶ</li><ul><li class="new">足幅の選び方（サイズガイド）</li><li>標準（2E相当） · ワイド（4E相当）</li></ul>
<li class="g">サポート</li><ul><li class="new">配送・送料 · 返品・交換 · お支払い方法</li><li>よくある質問</li><li class="new">お問い合わせ（LINE · メール · 電話）</li></ul>
<li class="g">会員</li><ul><li class="new">ログイン／会員登録 · 会員について</li></ul></ul></div>
</div>
<p><b>What the comparison shows.</b> Brolga already does what HOKA does for width, and better: width is a top-level way in, not a sub-item (strength). What HOKA's menu has and Brolga's doesn't is everything around the purchase: an account, order status and a help centre, all one tap from the menu (IA-5, IA-9). The single-link 足幅のこと group folds naturally into 足幅で選ぶ as its first item, where it becomes the width help the product page lacks (IA-3).</p>
</section>

<p class="small">A clean outline with one gap: the width, size and fit decision, the page's main job, has no heading, and the feature H3s skip from H1. Supports A1 in the report. No visually hidden or untranslated heading text was found.</p>

<section id="paths">
<div class="sec-head"><div class="no">05</div><h2>Main paths by task</h2>
<p class="lead">Eight tasks a Japanese runner brings to this site, walked on a 390 px phone from the starting point they'd use. Taps and screens scrolled are counted. <span class="tbd">Red</span> steps are friction; green chips show how a Japanese site handles the same step.</p></div>

<div class="task"><h3>T1 · 「幅広の足でも合うモデルはどれ？」 <span class="metric bad">2 taps to the list, width lost at the product</span></h3>
<div class="lbl">BROLGA JP · FROM THE TOP PAGE</div>
<div class="flow"><span class="st">Menu</span><span class="ar">→</span><span class="st">足幅で選ぶ › ワイド（4E相当）</span><span class="ar">→</span><span class="st x">7 cards; H1 still 「ランニングシューズ」</span><span class="ar">→</span><span class="st">Swell 3</span><span class="ar">→</span><span class="st x">Opens on 標準</span></div>
<div class="flow"><span class="st">Hero 「シューズを探す」</span><span class="ar">→</span><span class="st">10 cards</span><span class="ar">→</span><span class="st">絞り込み</span><span class="ar">→</span><span class="st">ワイド</span><span class="ar">→</span><span class="st">7件を表示</span><span class="ar">→</span><span class="st x">Back from a product: 10 cards again</span></div>
<div class="flow"><span class="st">Hero 「標準とワイドの違い」</span><span class="ar">→</span><span class="st">足幅のこと (screen 2.1)</span><span class="ar">→</span><span class="st x">No link to the wide models</span></div>
<div class="lbl">LOCAL SITE EXAMPLES</div>
<div class="flow"><span class="st g">HOKA: 「ワイドサイズ」 menu entry; width kept in the URL</span><span class="st g">ASICS: 「EXTRA WIDE」 in the product name</span></div>
<div class="task-ev"><figure><img data-img="0" data-src="img/f5-pdp-std-a@2x.png" width="390" height="140" style="width:390px" alt="Swell 3 opened on standard from the wide list"></figure><p class="note">The menu route is the best on the site, and the width is dropped one tap later. The content route costs 4 taps and loses the filter on the way back. Supports <a href="brolga-jp-localisation-review.html#f5">#5</a>, <a href="brolga-jp-localisation-review.html#f15">#15</a>, IA-1, IA-2, IA-10.</p></div>
</div>

<div class="task"><h3>T2 · 「自分は標準とワイド、どっち？」 <span class="metric bad">answer in 3 places, decisive in none</span></h3>
<div class="lbl">BROLGA JP · FROM SWELL 3</div>
<div class="flow"><span class="st">足幅 toggle (screen 2.1)</span><span class="ar">→</span><span class="st x">No help beside it</span><span class="ar">→</span><span class="st">「サイズガイド」 beside サイズ (2.3)</span><span class="ar">→</span><span class="st">Dialog, 2nd section 足幅の選び方</span><span class="ar">→</span><span class="st x">3E in both ranges; no girth (mm) table</span></div>
<div class="flow"><span class="st">Top 「標準とワイドの違い」</span><span class="ar">→</span><span class="st x">The same two ranges</span></div>
<div class="flow"><span class="st">Footer サイズの選び方</span><span class="ar">→</span><span class="st">/guide/#size</span><span class="ar">→</span><span class="st">「サイズガイドを開く」</span><span class="ar">→</span><span class="st x">The same dialog</span></div>
<div class="lbl">LOCAL SITE EXAMPLES</div>
<div class="flow"><span class="st g">ASICS: サイズガイド at the size row + MOBILE FOOT ID</span><span class="st g">On: fit verdict and size table under the button</span><span class="st g">montbell: 「サイズ表」 beside the size select</span></div>
<p class="note">Fails for the runners who most need it: someone who knows only "I wear 3E", or has measured 255 mm, gets no answer. Supports <a href="brolga-jp-localisation-review.html#f6">#6</a>, IA-3.</p>
</div>

<div class="task"><h3>T3 · 「Updraft Carbonは幅広の自分でも履ける？」 <span class="metric bad">answer in 1 scroll, next step 3.5 screens away</span></h3>
<div class="lbl">BROLGA JP · FROM UPDRAFT CARBON</div>
<div class="flow"><span class="st">Scroll 1.2 screens</span><span class="ar">→</span><span class="st">「足幅：標準（2E相当）のみ」 (2.2, grey 13 px)</span><span class="ar">→</span><span class="st x">「つま先はやや細め」 in 特徴, below the button (3.3)</span><span class="ar">→</span><span class="st x">Updraft Trainer (wide) only in the compare table (3.7) or the rail (5.7)</span></div>
<div class="lbl">LOCAL SITE EXAMPLES</div>
<div class="flow"><span class="st g">On: use blocks and fit verdict before the button</span><span class="st g">montbell: the wide version as a named product 「トレールランダー ワイド」</span></div>
<p class="note">The constraint is stated honestly; what's missing is "here's the closest wide option". Supports <a href="brolga-jp-localisation-review.html#f7">#7</a>, IA-7.</p>
</div>

<div class="task"><h3>T4 · 「いつ届く？送料は？」 <span class="metric ok">works: 1 scroll, conditions 1 tap away</span></h3>
<div class="lbl">BROLGA JP · FROM A PRODUCT PAGE</div>
<div class="flow"><span class="st">Scroll 1 screen</span><span class="ar">→</span><span class="st">Line under カートに追加 (2.8): free from ¥11,000, ships in 1–2 business days</span><span class="ar">→</span><span class="st">配送・返品 accordion: ¥660 below ¥11,000, Okinawa and islands +¥1,100</span></div>
<div class="lbl">LOCAL SITE EXAMPLES</div>
<div class="flow"><span class="st g">Mizuno: 「9時までの注文で当日出荷」 beside the price</span><span class="st g">montbell: 発送予定 per colour and size</span><span class="st g">Apple: 「最短で翌日」 at the price and the button</span></div>
<p class="note">A strength to keep. Small gaps: the line doesn't say it ships from Japan (<a href="brolga-jp-localisation-review.html#f13">#13</a>) and the free-shipping promise has no ※ for the island surcharge (A2).</p>
</div>

<div class="task"><h3>T5 · 「合わなかったら返品できる？」 <span class="metric bad">policy in 1 scroll; the "how" ends in 2 dead routes</span></h3>
<div class="lbl">BROLGA JP · FROM SWELL 3</div>
<div class="flow"><span class="st">Returns line under the button (2.9)</span><span class="ar">→</span><span class="st">配送・返品 accordion</span><span class="ar">→</span><span class="st x">「配送・返品について詳しく」 lands on shipping</span><span class="ar">→</span><span class="st">Scroll 0.8 to 返品・交換</span><span class="ar">→</span><span class="st x">「会員ページ」: no login anywhere</span><span class="ar">→</span><span class="st x">「またはLINEで」: no LINE</span></div>
<div class="lbl">LOCAL SITE EXAMPLES</div>
<div class="flow"><span class="st g">ASICS: OneASICS 30-day return named under the button, sign-in in the header</span><span class="st g">BALMUDA: 「100日間返金保証」 next to 購入</span><span class="st g">HOKA: ご注文の確認 in the menu</span></div>
<p class="note">4 taps and about 1.6 screens to the process, which then can't be started. Supports <a href="brolga-jp-localisation-review.html#f11">#11</a>, <a href="brolga-jp-localisation-review.html#f14">#14</a>, IA-5, IA-18.</p>
</div>

<div class="task"><h3>T6 · 「PayPayや後払いは使える？」 <span class="metric bad">PayPay in 1 scroll; 後払い answered only by absence</span></h3>
<div class="lbl">BROLGA JP · FROM A PRODUCT PAGE</div>

<div class="flow"><span class="st">Search 「後払い」</span><span class="ar">→</span><span class="st x">No match</span></div>
<div class="lbl">LOCAL SITE EXAMPLES</div>
<div class="flow"><span class="st g">Apple: payment section with a あと払い plan on the product page</span></div>
<p class="note">Brolga is ahead of ASICS, Mizuno and On in listing payment at the button; the gap is one sentence. Supports <a href="brolga-jp-localisation-review.html#f10">#10</a>, IA-12.</p>
</div>

<section id="labels">
<div class="sec-head"><div class="no">06</div><h2>Label audit: one concept, one name</h2>
<p class="lead">Width values are named identically everywhere, a strength. The catalogue, the size guide and membership are not.</p></div>
<div class="scroll"><table class="tbl">
<tr><th style="width:20%">Concept</th><th>Labels found (where)</th><th style="width:28%">Proposed</th></tr>
<tr><td>Catalogue /shoes/</td><td>すべてのシューズ (menu, footer) · ランニングシューズ (H1, breadcrumb) · ランニングシューズ一覧 (title) · 商品一覧 (H2) · すべて (chip) · シューズを探す (hero) · シューズを見る (empty cart) · すべて見る (rail): 8 names</td><td>「シューズ一覧」 in menu, H1, breadcrumb and title; CTAs keep the noun</td></tr>
<tr><td>Wide-filtered list</td><td>ワイド（4E相当） (menu, chip, filter) · H1 unchanged 「ランニングシューズ」</td><td>H1 and title 「ワイド（4E相当）のランニングシューズ」</td></tr>
<tr><td>Size guide</td><td>サイズガイド (product link, dialog) · サイズの選び方 (footer, /guide/) · 足のサイズと足幅の測り方を見る (top) · サイズガイドを開く (/guide/)</td><td>「サイズガイド」, plus 「足幅の選び方」 for the width section's entry</td></tr>
<tr><td>Width explainer</td><td>足幅のこと (menu, section) · 標準とワイドの違い (hero, desktop)</td><td>「標準とワイドの違い」 (names what you'll learn)</td></tr>
<tr><td>Membership</td><td>会員登録 (welcome, newsletter, returns line) · BROLGA MEMBERS · 会員ページ (returns, FAQ) · 登録する</td><td>「会員登録」 and 「マイページ」, both with a real destination</td></tr>
<tr><td>Contact</td><td>お問い合わせ (footer, guide) · LINEで相談する · メールで問い合わせる · 「メール・LINEで承ります」</td><td>Keep, once LINE exists</td></tr>
<tr><td>Shipping link</td><td>「配送・返品について詳しく」 → #shipping only</td><td>Two links: 配送について / 返品・交換について</td></tr>
<tr><td>Compare</td><td>ほかのモデルと比べる (link) · モデルを比べる (H2)</td><td>Keep, if the table always includes this model</td></tr>
<tr><td>Add to cart</td><td>カートに追加 (button, sticky bar) · レジに進む (cart)</td><td>Consider 「カートに入れる」, the more common verb</td></tr>
<tr><td>Width values</td><td class="ok">標準（2E相当）/ワイド（4E相当） in menu, filter, cards, toggle, guide, top</td><td>Keep</td></tr>
<tr><td>Legal</td><td class="ok">特定商取引法に基づく表記 (footer, /guide/, page)</td><td>Keep (statutory label)</td></tr>
</table></div>
<p class="small">Related: IA-3, IA-5, IA-10, IA-17, IA-18, IA-19.</p>
</section>

<section id="ia-findings">
<div class="sec-head"><div class="no">07</div><h2>IA findings</h2>
<p class="lead">In number order, each tagged with its layer (structure, labels, disclosure), on the report's priority scale. The right column links each to the localisation review.</p></div>
<div class="scroll"><table class="tbl">
<tr><th style="width:60px">#</th><th>Finding</th><th style="width:90px">Priority</th><th style="width:110px">Report</th></tr>
<tr><td>IA-1</td><td><span class="small">Structure · </span><b>The chosen width is dropped when a product opens.</b> Wide-list cards link to the bare product URL; <code>?width=wide</code> is ignored.</td><td><span class="sev high">High</span></td><td><a href="brolga-jp-localisation-review.html#f5">Finding 5</a></td></tr>
<tr><td>IA-2</td><td><span class="small">Structure · </span><b>Filters and sort live in page state only.</b> Back, sharing and the use chips lose them.</td><td><span class="sev high">High</span></td><td><a href="brolga-jp-localisation-review.html#f5">Finding 5</a></td></tr>
<tr><td>IA-3</td><td><span class="small">Labels · </span><b>"Which width am I?" has three homes and no decisive answer;</b> the only help link sits beside サイズ.</td><td><span class="sev high">High</span></td><td><a href="brolga-jp-localisation-review.html#f6">Finding 6</a></td></tr>
<tr><td>IA-4</td><td><span class="small">Structure · </span><b>The size filter ignores stock.</b> ワイド + 22.0 returns 7 of 7, including a model with nothing in stock.</td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f16">Finding 16</a></td></tr>
<tr><td>IA-5</td><td><span class="small">Structure · </span><b>Membership has no home.</b> A condition of the run-return, with no login, registration or 会員ページ anywhere.</td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f11">Finding 11</a></td></tr>
<tr><td>IA-6</td><td><span class="small">Structure · </span><b>「LINEで相談する」 leads to a page with no LINE;</b> contact is outside the menu.</td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f14">Finding 14</a></td></tr>
<tr><td>IA-7</td><td><span class="small">Disclosure · </span><b>Standard-only models give no route to their wide sibling</b> at the decision point.</td><td><span class="sev high">High</span></td><td><a href="brolga-jp-localisation-review.html#f7">Finding 7</a></td></tr>
<tr><td>IA-8</td><td><span class="small">Structure · </span><b>Search covers products only;</b> service questions dead-end.</td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f14">Finding 14</a></td></tr>
<tr><td>IA-9</td><td><span class="small">Structure · </span><b>The menu hides support:</b> contact, returns and the size guide are footer-only.</td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f14">Finding 14</a></td></tr>
<tr><td>IA-10</td><td><span class="small">Structure · </span><b>Width is second-level on the listing,</b> and a width-filtered list doesn't say so in its H1 or title.</td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f15">Finding 15</a></td></tr>
<tr><td>IA-11</td><td><span class="small">Labels · </span><b>「ほかのモデルと比べる」 compares a fixed four,</b> sometimes without the current model.</td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f18">Finding 18</a></td></tr>
<tr><td>IA-12</td><td><span class="small">Labels · </span><b>後払い is answered only by absence.</b></td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f10">Finding 10</a></td></tr>
<tr><td>IA-13</td><td><span class="small">Disclosure · </span><b>The welcome sheet interrupts the first visit,</b> including on a product page, and is the only place 会員 is explained.</td><td><span class="sev high">High</span></td><td><a href="brolga-jp-localisation-review.html#f2">Finding 2</a></td></tr>
<tr><td>IA-14</td><td><span class="small">Disclosure · </span><b>A sold-out page keeps カートに追加 as the main action.</b></td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f16">Finding 16</a></td></tr>
<tr><td>IA-15</td><td><span class="small">Disclosure · </span><b>Fit advice for the size choice sits after the button</b> or in a closed accordion.</td><td><span class="sev high">High</span></td><td><a href="brolga-jp-localisation-review.html#f7">Finding 7</a></td></tr>
<tr><td>IA-16</td><td><span class="small">Labels · </span><b>The top-page review heading says Swell 3; the list doesn't.</b></td><td><span class="sev mid">Medium</span></td><td><a href="brolga-jp-localisation-review.html#f12">Finding 12</a></td></tr>
<tr><td>IA-17</td><td><span class="small">Labels · </span><b>One concept, many names</b> (catalogue 8, size guide 4).</td><td><span class="sev low">Low</span></td><td><a href="brolga-jp-localisation-review.html#a2">A2</a></td></tr>
<tr><td>IA-18</td><td><span class="small">Labels · </span><b>「配送・返品について詳しく」 lands on shipping only.</b></td><td><span class="sev low">Low</span></td><td><a href="brolga-jp-localisation-review.html#a2">A2</a></td></tr>
<tr><td>IA-19</td><td><span class="small">Labels · </span><b>「カートに追加」 rather than 「カートに入れる」.</b></td><td><span class="sev low">Low</span></td><td><a href="brolga-jp-localisation-review.html#a2">A2</a></td></tr>
<tr><td>IA-20</td><td><span class="small">Labels · </span><b>Small inconsistencies:</b> no キッズ tile, a width called a 用途, お支払い方法 twice in the footer, guide tabs not sticky.</td><td><span class="sev low">Low</span></td><td><a href="brolga-jp-localisation-review.html#a2">A2</a></td></tr>
</table></div>
<p class="small">Priorities follow the report: where a lens item merged into a High report finding, it carries High here. IA-13 is High on product pages and Medium elsewhere.</p>
</section>

<section id="proposal">
<div class="sec-head"><div class="no">08</div><h2>Proposed structure</h2>
<p class="lead">A direction for the templates, not a final layout. Moved or new sections are in green, with the reason.</p></div>
<div class="prop-grid">
<div><h3>Product page · 11 sections</h3><ol>
<li>Header and breadcrumb</li><li>Gallery, with dots and 5–6 views</li><li>Name, rating, price （税込）</li>
<li class="moved">足幅 with 「足幅の選び方」 and the outline drawing · fit line under サイズ · wide alternative on standard-only models · button<span class="why">Help where the width and size are chosen, not beside サイズ or below the button (#6, #7, #8)</span></li>
<li class="moved">Service list: 国内倉庫から発送, returns with 会員について, payment marks<span class="why">Answers the import and membership doubts at the button (#10, #11, #13)</span></li>
<li class="moved">Fit summary from reviews (サイズ感, 標準／ワイド filter)<span class="why">From screen 4.4, reduced to the part that helps choose (#12)</span></li>
<li class="moved">Compare: this model plus the closest 2–3<span class="why">Always includes the current model (#18)</span></li>
<li>特徴 · スペック · 配送・返品 · お手入れ</li><li>All reviews</li><li>こちらもおすすめ</li><li>Footer</li></ol></div>
<div><h3>Top page · 11 sections</h3><ol>
<li>Header</li><li>Hero 「足幅で選ぶ、という選択肢。」</li>
<li class="moved">足幅のこと, ending in links to 標準 and ワイド models<span class="why">The explainer is a dead end today (T1)</span></li>
<li class="moved">「日本での体制」 strip: Japanese company, Chiba warehouse, support hours, 特商法<span class="why">New: answers "does it ship from abroad?" (#13)</span></li>
<li>新作とおすすめ</li><li>用途で選ぶ (+ キッズ)</li>
<li class="moved">30日間走って返品, with 会員について<span class="why">The condition gets a route (#11)</span></li>
<li class="moved">履いた人の声, heading matching the content, with a source line<span class="why">#12</span></li>
<li>フリーマントルから</li><li>Newsletter</li><li>Footer</li></ol></div>
<div><h3>All shoes · 5 sections</h3><ol>
<li>Header and breadcrumb</li>
<li class="moved">H1 that names the filter (「ワイド（4E相当）のランニングシューズ」)<span class="why">The page confirms the intent (#15)</span></li>
<li class="moved">Width toggle beside the use chips<span class="why">The brand's main axis at the first level (#15)</span></li>
<li class="moved">Cards, with filters, sort and width in the URL<span class="why">Back and sharing keep the list (#5)</span></li>
<li>Footer</li></ol></div>
<div><h3>Menu · 4 groups</h3><ol>
<li>用途で選ぶ</li>
<li class="moved">足幅で選ぶ, starting with 「足幅の選び方」<span class="why">The single-link group folded in (#6)</span></li>
<li class="moved">サポート: 配送 · 返品 · お支払い · FAQ · お問い合わせ<span class="why">From the footer only (#14)</span></li>
<li class="moved">会員: ログイン／会員登録<span class="why">New (#11)</span></li></ol></div>
</div>
</section>

<section id="candidates">
<div class="sec-head"><div class="no">09</div><h2>Additional findings</h2>
<p class="lead">Seen while mapping the structure; not yet in the report. Worth confirming.</p></div>
<div class="scroll"><table class="tbl cand">
<tr><th style="width:60px">#</th><th>What we saw</th><th style="width:28%">Where</th></tr>
<tr><td>N1</td><td>Two sizing rules sit side by side without being reconciled: 「普段お履きのランニングシューズと同じサイズ（cm）」 on /guide/#size, and 「足長に0.5〜1.0cmを足したサイズが目安」 in the size guide.</td><td>/guide/#size, size guide dialog</td></tr>
<tr><td>N2</td><td>The size guide's conversion table has US men's and EU only; no US women's column, though women's sizes from 22.0 are sold.</td><td>Size guide dialog</td></tr>
<tr><td>N3</td><td>On the overflowing pages, the header stops sticking under mobile emulation (it scrolls away), while it sticks on /shoes/ and in a plain 390 window; likely another side effect of finding 1, to confirm on a device.</td><td>Product pages and top page, phone</td></tr>
<tr><td>N4</td><td>The footer link 「メールで問い合わせる」 wraps to three lines at 320 px.</td><td>Footer, narrow phones</td></tr>
<tr><td>N5</td><td>The desktop header has three destinations (シューズ, 足幅のこと, ご利用ガイド); contact and account are not among them.</td><td>Desktop header</td></tr>
</table></div>
</section>

<section id="notes">
<div class="sec-head"><div class="no">10</div><h2>Further notes</h2></div>
<ul>
<li><b>To confirm with client data:</b> the share of wide-intent sessions (menu, filter, search) that add 標準 to cart (IA-1); width and size exchange reasons (IA-3, IA-15); zero-result search queries (IA-8); whether account features exist behind checkout (IA-5).</li>
<li><b>Benchmarks in context:</b> ASICS and Mizuno make wide a separate product because each width is its own product line and catches 「幅広」 searches by name. Brolga's single-page selector is better for comparing the two fits; the proposal keeps it and carries the width in the URL instead. HOKA's menu is organised by gender first, which suits a broad range; Brolga's use-and-width menu suits a narrow, width-led range and should stay.</li>
<li><b>Method:</b> paths walked in Chrome at 390 × 844 with mobile emulation, from the locally served build; a screen is 844 px, and "screen n" is the position from the top (y ÷ 844 + 1). Section positions measured from the DOM; On's product page measured live in a browser at 390 × 844; HOKA's menu read live. Taps counted as the user would make them; cart and checkout not entered.</li>
<li><b>Limits:</b> the overflow (finding 1) can change how far a phone actually scrolls; positions were measured on pages without it where it mattered.</li>
</ul>
</section>

<script>
/* Shared behaviour for every deliverable: language switch, embedded images, lightbox, marker
   toggle. Content lives in <template id="t-en"> (and <template id="t-ja"> when a second language
   is delivered); the chosen one is copied into #app. Title per language: data-title on the
   <template>. ?lang= and localStorage keep the choice across the package's documents.
   assemble.mjs inlines this file and sets window.__IMG (data-img="n" -> data URI). */
(function(){
  var KEY='review-lang';
  var langs=[].map.call(document.querySelectorAll('template[id^="t-"]'),function(t){return t.id.slice(2);});
  function pick(){
    try{var u=new URLSearchParams(location.search).get('lang');if(langs.indexOf(u)>=0)return u;}catch(e){}
    try{var s=localStorage.getItem(KEY);if(langs.indexOf(s)>=0)return s;}catch(e){}
    var nav=(navigator.language||'').toLowerCase().slice(0,2);
    return langs.indexOf(nav)>=0?nav:langs[0];
  }
  function imgs(root){
    if(!window.__IMG)return;
    root.querySelectorAll('[data-img]').forEach(function(i){var v=window.__IMG[i.getAttribute('data-img')];if(v)i.src=v;});
  }
  function render(l){
    var app=document.getElementById('app'),t=document.getElementById('t-'+l);if(!t)return;
    var y=window.scrollY;
    app.innerHTML=t.innerHTML; imgs(document);
    document.documentElement.lang=l;
    if(t.dataset.title)document.title=t.dataset.title;
    document.querySelectorAll('.lang-switch button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false');});
    try{localStorage.setItem(KEY,l);}catch(e){}
    try{var u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u.toString());}catch(e){}
    try{if(typeof window.reviewInit==='function')window.reviewInit(app,l);}catch(e){console.error(e);}
    window.scrollTo(0,y);
  }
  var sw=document.querySelector('.lang-switch');
  if(sw&&langs.length<2)sw.hidden=true;
  document.addEventListener('click',function(e){
    var b=e.target.closest('.lang-switch button');
    if(b){render(b.dataset.l);return;}
    var tg=e.target.closest('[data-toggle-markers]');
    if(tg){var st=document.querySelector('.stage');if(st)st.classList.toggle('markers-off');return;}
    var im=e.target.closest('figure img');
    var lb=document.getElementById('lb');
    if(im&&lb){lb.querySelector('img').src=im.src;lb.style.display='flex';return;}
    if(lb&&e.target.closest('#lb')){lb.style.display='none';return;}
    var a=e.target.closest('a[href]');
    if(a&&langs.length>1){var h=a.getAttribute('href');
      if(/^[^:#?]+\.html(#.*)?$/.test(h)){e.preventDefault();var p=h.split('#');location.href=p[0]+'?lang='+document.documentElement.lang+(p[1]?'#'+p[1]:'');}}
  });
  document.addEventListener('keydown',function(e){var lb=document.getElementById('lb');if(e.key==='Escape'&&lb)lb.style.display='none';});
  render(pick());
  if(location.hash){var el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();}
})();

</script>
